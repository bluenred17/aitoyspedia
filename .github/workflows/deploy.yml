name: Deploy

# Hanya push ke main. Jangan menambah pemicu pull_request: workflow ini memegang kunci SSH ke server.
on:
  push:
    branches: [main]

permissions:
  contents: read

# Satu deploy pada satu waktu, dan jangan membatalkan yang sedang berjalan di tengah jalan.
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  APP_DIR: /var/www/ai-encyclopedia-site
  RELEASE: /var/www/ai-encyclopedia-site/releases/${{ github.sha }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check content (schema, related links, secret scan)
        run: npm run check

      - name: Unit tests
        run: npm test

      - name: Build site and search index
        run: npm run build

      - name: Install browser for e2e tests
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests against the build
        run: npm run test:e2e

      - name: Prepare SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Upload release
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          SSH_OPTS="-i $HOME/.ssh/deploy_key -o IdentitiesOnly=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts -o StrictHostKeyChecking=yes"
          ssh $SSH_OPTS "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p '$RELEASE'"
          rsync -az --delete -e "ssh $SSH_OPTS" dist/ "$DEPLOY_USER@$DEPLOY_HOST:$RELEASE/"

      - name: Activate release and prune old ones
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          SSH_OPTS="-i $HOME/.ssh/deploy_key -o IdentitiesOnly=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts -o StrictHostKeyChecking=yes"
          # Variabel di heredoc diperluas di runner, jadi server menerima path yang sudah final.
          ssh $SSH_OPTS "$DEPLOY_USER@$DEPLOY_HOST" bash -s <<EOF
          set -euo pipefail
          ln -sfn "$RELEASE" "$APP_DIR/current.tmp"
          mv -T "$APP_DIR/current.tmp" "$APP_DIR/current"
          ls -1dt "$APP_DIR"/releases/* | tail -n +4 | xargs -r rm -rf
          EOF
