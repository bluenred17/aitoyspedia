# Acuan untuk blok server ai.toyspedia.fun. JANGAN menimpa seluruh blok yang ada.
#
# Pertahankan baris `listen` dan `ssl_certificate*` dari blok lama (TLS dari certbot).
# Ganti hanya arahan yang menghubungkan domain ini ke aplikasi Express lama (arahan proxy beserta
# blok location yang memakainya) dengan isi di bawah. Cocokkan dengan keluaran `sudo nginx -T`.

server {
    server_name ai.toyspedia.fun;

    # listen 443 ssl;                                  <- tetap dari blok lama
    # ssl_certificate     /etc/letsencrypt/...;        <- tetap dari blok lama
    # ssl_certificate_key /etc/letsencrypt/...;        <- tetap dari blok lama

    root /var/www/ai-encyclopedia/current;
    index index.html;

    # Situs ini tidak boleh diindeks (spec §8). `always` agar header ikut pada respons 404.
    add_header X-Robots-Tag "noindex" always;

    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # Aset ber-hash dari Astro aman di-cache lama. add_header di dalam location menggantikan semua
    # yang diwarisi dari server, jadi X-Robots-Tag harus diulang di sini.
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Robots-Tag "noindex" always;
    }

    error_page 404 /404.html;
}
