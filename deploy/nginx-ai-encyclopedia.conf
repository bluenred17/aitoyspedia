# Acuan blok server untuk ai.toyspedia.fun (situs statis). Baca docs/cutover.md Langkah 5 sebelum memakainya.
#
# Di servermu, satu blok 443 dan satu blok 80 dipakai BERSAMA oleh empat nama
# (ai.toyspedia.fun, aipedia.toyspedia.fun, toyspedia.fun, www.toyspedia.fun) dan semuanya diteruskan ke Express
# di port 3000. Karena itu ai.toyspedia.fun harus DIPISAH ke blok sendiri, dan namanya dikeluarkan dari
# `server_name` blok lama. Tiga nama lain tetap dilayani blok lama. Jangan menimpa blok lama dengan isi ini.
#
# Sertifikat Let's Encrypt-nya sama (live/ai.toyspedia.fun melayani keempat nama), jadi baris ssl di bawah
# sama dengan blok lama.

server {
    server_name ai.toyspedia.fun;

    # Tanpa opsi ipv6only: blok lama sudah memakainya untuk alamat dan port yang sama, dan mengulanginya
    # membuat `nginx -t` gagal dengan "duplicate listen options".
    listen [::]:443 ssl;
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/ai.toyspedia.fun/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ai.toyspedia.fun/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/ai-encyclopedia-site/current;
    index index.html;

    # Situs ini tidak boleh diindeks (spec §8). `always` agar header ikut pada respons 404.
    add_header X-Robots-Tag "noindex" always;

    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # Aset ber-hash dari Astro aman di-cache lama. add_header di dalam location menggantikan semua
    # yang diwarisi dari server, jadi X-Robots-Tag harus diulang di sini.
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Robots-Tag "noindex" always;
    }

    error_page 404 /404.html;
}

# Port 80 untuk ai.toyspedia.fun. Setelah namanya dikeluarkan dari blok port 80 yang lama, request http
# ke nama ini akan sampai ke blok ini dan dialihkan ke https.
server {
    listen 80;
    listen [::]:80;
    server_name ai.toyspedia.fun;
    return 301 https://$host$request_uri;
}
